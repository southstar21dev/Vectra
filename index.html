<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vectra for AltStore</title>
<meta name="description" content="Add the Vectra source to AltStore." />
<style>
  :root { --bg: #0b0b10; --card: #15151d; --text: #f4f4f7; --muted: #a1a1b3; --accent: #8b5cf6; --border: #2a2a36; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f6f9; --card: #ffffff; --text: #15151d; --muted: #5d5d70; --border: #e2e2ea; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 32px 24px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { margin: 16px 0 4px; font-size: 26px; }
  p { margin: 0 0 20px; color: var(--muted); }
  a.button { display: block; padding: 14px 18px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
  a.secondary { display: block; margin-top: 12px; color: var(--accent); text-decoration: none; font-weight: 600; }
  code { display: block; margin-top: 20px; padding: 12px; border-radius: 14px; border: 1px solid var(--border); font-size: 12px; word-break: break-all; color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="https://raw.githubusercontent.com/southstar21dev/Vectra/master/.github/readme/logo.png" alt="" />
  <h1>Vectra</h1>
  <p>Opening AltStore… If nothing happens, tap the button. AltStore must be installed on this iPhone.</p>
  <a class="button" id="stable" href="altstore://source?url=https://raw.githubusercontent.com/southstar21dev/Vectra/altstore/stable.json">Add to AltStore</a>
  <a class="secondary" href="altstore://source?url=https://raw.githubusercontent.com/southstar21dev/Vectra/altstore/beta.json">Add the beta source instead</a>
  <code>https://raw.githubusercontent.com/southstar21dev/Vectra/altstore/stable.json</code>
</main>
<script>
  // Open AltStore straight away, unless the page was opened for the beta link.
  if (!location.hash.includes("beta")) location.href = document.getElementById("stable").href;
</script>
</body>
</html>
