# semantic-release for the native apps.
#
#   master  -> 1.4.0         stable: GitHub release + AltStore source stable.json
#   staging -> 1.4.0-rc.N    prerelease: GitHub prerelease + AltStore source beta.json
#   dev     -> 1.4.0-dev.N   prerelease: GitHub prerelease + AltStore source beta.json
#
# The version comes from Conventional Commits since the last tag (feat: minor, fix:/perf: patch,
# `!` or BREAKING CHANGE: major; chore:/docs:/refactor: etc. release nothing). Every push runs CI
# first; then a dry run decides the version, the APK and IPA are built with it, and only then is the
# tag and GitHub release created with both attached, so a failed build never leaves a bare release.
#
# The web app and the backend deploy from master through Coolify; they aren't built here.
#
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (Android signing).
# The IPA is unsigned; AltStore signs it with the installing user's Apple ID.
name: Release

on:
  push:
    branches: [master, staging, dev]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SEMANTIC_RELEASE: semantic-release@24.2.3 @semantic-release/exec@7.0.3 conventional-changelog-conventionalcommits@8.0.0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  plan:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      # The dry run verifies it could push the tag.
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install semantic-release
        run: |
          # $SEMANTIC_RELEASE is a list of packages: split on purpose.
          # shellcheck disable=SC2086
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/semrel" $SEMANTIC_RELEASE

      - id: plan
        name: Decide the version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$RUNNER_TEMP/semrel/node_modules/.bin/semantic-release" --dry-run
          if [ -f .release-version ]; then
            echo "version=$(cat .release-version)" >> "$GITHUB_OUTPUT"
            echo "Releasing $(cat .release-version)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release-worthy commits since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Set the version
        run: perl -pi -e "s/^vectra.versionName=.*/vectra.versionName=$VERSION/" native/gradle.properties

      - name: Build the signed APKs
        working-directory: native
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ./gradlew :androidApp:assembleRelease \
            -Pvectra.keystore="$RUNNER_TEMP/release.jks" \
            -Pvectra.storePassword="$KEYSTORE_PASSWORD" \
            -Pvectra.keyAlias="$KEY_ALIAS" \
            -Pvectra.keyPassword="$KEY_PASSWORD"
          rm "$RUNNER_TEMP/release.jks"

      - name: Collect
        run: |
          mkdir -p release-assets
          OUT=native/androidApp/build/outputs/apk/release
          cp "$OUT/androidApp-universal-release.apk" "release-assets/Vectra-$VERSION.apk"
          cp "$OUT/androidApp-arm64-v8a-release.apk" "release-assets/Vectra-$VERSION-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/
          if-no-files-found: error

  ios:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Set the version
        run: perl -pi -e "s/^vectra.versionName=.*/vectra.versionName=$VERSION/" native/gradle.properties

      - name: Build the unsigned IPA
        run: |
          xcodebuild build \
            -project native/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p "$RUNNER_TEMP/ipa/Payload" release-assets
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Vectra.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/release-assets/Vectra-$VERSION.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: [plan, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Install semantic-release
        run: |
          # $SEMANTIC_RELEASE is a list of packages: split on purpose.
          # shellcheck disable=SC2086
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/semrel" $SEMANTIC_RELEASE

      - name: Tag and publish the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$RUNNER_TEMP/semrel/node_modules/.bin/semantic-release"
          RELEASED="$(cat .release-version 2>/dev/null || true)"
          if [ "$RELEASED" != "$VERSION" ]; then
            echo "::error::Planned $VERSION but released '${RELEASED:-nothing}' (the branch moved?)."
            exit 1
          fi

      - name: Update the AltStore source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            master) CHANNEL=stable ;;
            *) CHANNEL=beta ;;
          esac
          IPA="release-assets/Vectra-$VERSION.ipa"
          IPA_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Vectra-$VERSION.ipa"
          IPA_SIZE="$(stat -c%s "$IPA")"
          NOTES="$(gh release view "v$VERSION" --json body -q .body)"
          export CHANNEL VERSION IPA_URL IPA_SIZE NOTES

          git config user.name "vectra-bot"
          git config user.email "vectra-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin altstore >/dev/null; then
            git fetch -q origin altstore
            git worktree add -q "$RUNNER_TEMP/altstore" origin/altstore
          else
            git worktree add -q --detach "$RUNNER_TEMP/altstore"
            (cd "$RUNNER_TEMP/altstore" && git checkout -q --orphan altstore && git rm -rqf .)
          fi
          node .github/scripts/altstore-source.mjs "$RUNNER_TEMP/altstore/$CHANNEL.json"
          cd "$RUNNER_TEMP/altstore"
          git add "$CHANNEL.json"
          git commit -qm "chore: Vectra $VERSION in the $CHANNEL AltStore source"
          git push -q origin HEAD:altstore
