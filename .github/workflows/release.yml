# semantic-release for the native apps.
#
#   master  -> 1.4.0         GitHub release
#   dev     -> CI only       no builds, no release (dev builds are checked locally)
#
# The version comes from Conventional Commits since the last tag (feat: minor, fix:/perf: patch,
# `!` or BREAKING CHANGE: major; chore:/docs:/refactor: etc. release nothing). A dry run decides the
# version and the APK and IPA are built with it while CI runs alongside; only once CI and both builds
# pass is the tag and GitHub release created, so a failed build or test never leaves a release.
#
# A push to master whose tree is identical to dev's head, where CI already passed, skips CI: the
# promotion merge changes nothing that was tested. CI here always runs every job (all-jobs), so
# "passed" means each of web, backend and native succeeded on that exact commit; a skipped job
# never counts.
#
# The release APK is also launched on an emulator first (android-launch.yml), so a crash that only
# the shrunk release build has stops the release.
#
# When every commit since the last release has a "Platforms: android" line, only Android is built
# and released; iPhones stay on the previous version (the AltStore source lists IPA releases only).
#
# Obtainium (Android) watches the releases directly. AltStore/SideStore (iOS) read the sources the
# `pages` job rebuilds from the releases and publishes to GitHub Pages with the install page:
#   https://southstar21dev.github.io/Vectra/                    install page
#   https://southstar21dev.github.io/Vectra/altstore.json       master releases
#   https://southstar21dev.github.io/Vectra/altstore-beta.json  the same plus the old dev prereleases
#                                                                (no new ones are built; kept for existing subscribers)
# Run the workflow by hand (gh workflow run release.yml --ref master) to republish them without
# releasing, e.g. after editing a release's notes.
#
# The web app and the backend deploy from master through Coolify; they aren't built here.
#
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (Android signing).
# The IPA is unsigned; AltStore signs it with the installing user's Apple ID.
# TestFlight gets a separately signed App Store build of the same release (the testflight job),
# once the App Store Connect key secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 are set.
name: Release

on:
  push:
    branches: [master, dev]
  # Republishes the AltStore/SideStore sources without releasing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides whether CI can be skipped because this exact tree already passed on dev.
  verified:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      skip-ci: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          [ "$GITHUB_REF" = refs/heads/master ] || exit 0
          DEV_SHA="$(git rev-parse origin/dev)"
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse "$DEV_SHA^{tree}")" ]; then
            echo "Tree differs from dev ($DEV_SHA); running CI." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Dev's CI runs every job (all-jobs), so web, backend and native must each have a run on
          # dev's head, and every CI run there must have succeeded. Skipped is not green: it means
          # the job never ran (an older dev run with a path filter, or a failed dependency).
          # Anything still running, failed, skipped or missing means CI runs here.
          # $ci and $job are jq variables, not shell ones.
          # shellcheck disable=SC2016
          GREEN="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEV_SHA/check-runs?per_page=100" --jq '
            [.check_runs[] | select(.name | startswith("ci / "))] as $ci
            | ($ci | length > 0)
              and ($ci | all(.conclusion == "success"))
              and (["ci / web", "ci / backend", "ci / native"] | all(. as $job | $ci | any(.name | startswith($job))))')"
          if [ "$GREEN" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Same tree as dev ($DEV_SHA), where CI passed; skipping CI." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Same tree as dev ($DEV_SHA), but CI there isn't green yet; running CI." >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    needs: verified
    if: needs.verified.outputs.skip-ci != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      # A release is gated on every component, not only the ones the path filter saw change.
      all-jobs: true
    permissions:
      contents: read
      pull-requests: read

  # Runs alongside CI; publish waits for both. Only master releases.
  plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      # The dry run verifies it could push the tag.
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ios: ${{ steps.platforms.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # semantic-release authenticates its git calls from GITHUB_TOKEN itself; keep the token
          # out of .git/config so only the step that runs semantic-release can use it.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # From the committed lockfile (.github/release-tools), with no lifecycle scripts: the job holds
      # a write token, so nothing resolved fresh or run at install time may reach it.
      - name: Install semantic-release
        run: |
          mkdir -p "$RUNNER_TEMP/semrel"
          cp .github/release-tools/package.json .github/release-tools/package-lock.json "$RUNNER_TEMP/semrel/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/semrel"

      # An Android-only fix skips the iOS build: when every commit since the last release carries a
      # "Platforms: android" line, the release gets the APKs and AAB only. The AltStore source lists
      # releases that have an IPA, so iPhones simply stay on the previous version.
      - id: platforms
        name: Decide the platforms
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=${LAST:+$LAST..}HEAD
          TOTAL=$(git rev-list --no-merges --count "$RANGE")
          ANDROID=$(git rev-list --no-merges --grep '^Platforms: android$' --count "$RANGE")
          if [ "$TOTAL" -gt 0 ] && [ "$TOTAL" = "$ANDROID" ]; then
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "Android only: every commit since ${LAST:-the start} is marked Platforms: android." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

      - id: plan
        name: Decide the version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$RUNNER_TEMP/semrel/node_modules/.bin/semantic-release" --dry-run
          if [ -f .release-version ]; then
            echo "version=$(cat .release-version)" >> "$GITHUB_OUTPUT"
            echo "Releasing $(cat .release-version)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release-worthy commits since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Set the version
        run: perl -pi -e "s/^vectra.versionName=.*/vectra.versionName=$VERSION/" native/gradle.properties

      # The APKs are for Obtainium and direct download; the AAB is what Google Play takes.
      - name: Build the signed APKs and AAB
        working-directory: native
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          SIGNING=(
            -Pvectra.keystore="$RUNNER_TEMP/release.jks"
            -Pvectra.storePassword="$KEYSTORE_PASSWORD"
            -Pvectra.keyAlias="$KEY_ALIAS"
            -Pvectra.keyPassword="$KEY_PASSWORD"
          )
          # Two invocations: androidApp turns the ABI splits off whenever a bundle task is
          # requested, so a combined run would build one plain APK instead of universal + arm64.
          ./gradlew :androidApp:assembleRelease "${SIGNING[@]}"
          ./gradlew :androidApp:bundleRelease "${SIGNING[@]}"

      - name: Collect
        run: |
          mkdir -p release-assets
          OUT=native/androidApp/build/outputs/apk/release
          cp "$OUT/androidApp-universal-release.apk" "release-assets/Vectra-$VERSION.apk"
          cp "$OUT/androidApp-arm64-v8a-release.apk" "release-assets/Vectra-$VERSION-arm64.apk"
          cp native/androidApp/build/outputs/bundle/release/androidApp-release.aab "release-assets/Vectra-$VERSION.aab"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: release-assets/
          if-no-files-found: error

  # Opens the release APK on an emulator before anything is published (android-launch.yml).
  android-launch:
    needs: android
    uses: ./.github/workflows/android-launch.yml

  ios:
    needs: plan
    if: needs.plan.outputs.version != '' && needs.plan.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # Kotlin/Native's compiler bundle and LLVM/sysroot live in ~/.konan, which setup-gradle doesn't
      # cache; without this every macOS run downloads them again. Keyed on the Kotlin version.
      - id: kotlin
        name: Read the Kotlin version
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"/\1/p' native/gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Set the version
        run: perl -pi -e "s/^vectra.versionName=.*/vectra.versionName=$VERSION/" native/gradle.properties

      - name: Build the unsigned IPA
        run: |
          xcodebuild build \
            -project native/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p "$RUNNER_TEMP/ipa/Payload" release-assets
          APP="$RUNNER_TEMP/ipa/Payload/Vectra.app"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Vectra.app" "$APP"
          # Ad-hoc signatures that carry the App Group the widgets share with the app. SideStore and
          # AltStore read the entitlements from the binaries and register the group (renamed with
          # the installing user's team) when they re-sign; an unsigned binary has none to read.
          # Only the App Group: a free Apple ID can't have associated domains.
          cat > "$RUNNER_TEMP/sideload.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.application-groups</key><array><string>group.dev.southstar21.vectra</string></array>
          </dict></plist>
          PLIST
          codesign --force --sign - --entitlements "$RUNNER_TEMP/sideload.entitlements" "$APP/PlugIns/VectraWidgets.appex"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/sideload.entitlements" "$APP"
          codesign -d --entitlements - "$APP/PlugIns/VectraWidgets.appex" | grep -q application-groups
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/release-assets/Vectra-$VERSION.ipa" Payload)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: [verified, ci, plan, android, android-launch, ios]
    # CI must have passed here, or been skipped because this tree already passed on dev.
    if: >-
      ${{ !cancelled()
      && needs.android.result == 'success'
      && needs.android-launch.result == 'success'
      && (needs.ios.result == 'success' || (needs.ios.result == 'skipped' && needs.plan.outputs.ios == 'false'))
      && (needs.ci.result == 'success'
          || (needs.ci.result == 'skipped' && needs.verified.outputs.skip-ci == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # semantic-release authenticates its git calls from GITHUB_TOKEN itself; keep the token
          # out of .git/config so only the step that runs semantic-release can use it.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          merge-multiple: true

      # From the committed lockfile (.github/release-tools), with no lifecycle scripts: the job holds
      # a write token, so nothing resolved fresh or run at install time may reach it.
      - name: Install semantic-release
        run: |
          mkdir -p "$RUNNER_TEMP/semrel"
          cp .github/release-tools/package.json .github/release-tools/package-lock.json "$RUNNER_TEMP/semrel/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/semrel"

      - name: Tag and publish the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$RUNNER_TEMP/semrel/node_modules/.bin/semantic-release"
          RELEASED="$(cat .release-version 2>/dev/null || true)"
          if [ "$RELEASED" != "$VERSION" ]; then
            echo "::error::Planned $VERSION but released '${RELEASED:-nothing}' (the branch moved?)."
            exit 1
          fi

  # Sends the released version to TestFlight: a signed App Store build of the same commit and
  # version as the GitHub release (the AltStore IPA above stays unsigned). Runs only after publish,
  # so TestFlight never gets a build that wasn't released. Signing is cloud-managed: xcodebuild
  # fetches the distribution certificate and profiles with the App Store Connect API key, so no
  # certificate is stored here. Skipped (with a note in the summary) until these secrets exist:
  #   ASC_KEY_ID      the key's ID
  #   ASC_ISSUER_ID   the issuer ID shown above the keys list
  #   ASC_KEY_P8      the contents of the downloaded AuthKey_<id>.p8
  # The key needs the Admin role (cloud-managed distribution signing requires it).
  testflight:
    name: TestFlight
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.ios == 'true' }}
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - id: key
        name: Check for the App Store Connect key
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "TestFlight upload skipped: set ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: steps.key.outputs.ok == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - id: kotlin
        if: steps.key.outputs.ok == 'true'
        name: Read the Kotlin version
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"/\1/p' native/gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - if: steps.key.outputs.ok == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      - if: steps.key.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - if: steps.key.outputs.ok == 'true'
        name: Set the version
        run: perl -pi -e "s/^vectra.versionName=.*/vectra.versionName=$VERSION/" native/gradle.properties

      - if: steps.key.outputs.ok == 'true'
        name: Archive and upload to TestFlight
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive \
            -project native/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -archivePath "$RUNNER_TEMP/Vectra.xcarchive" \
            "${AUTH[@]}"
          # destination=upload: the export sends the build straight to App Store Connect.
          cat > "$RUNNER_TEMP/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>3HNYQ2F575</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Vectra.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
          echo "Uploaded $VERSION to TestFlight; it appears there once App Store Connect finishes processing." >> "$GITHUB_STEP_SUMMARY"

      - if: always() && steps.key.outputs.ok == 'true'
        name: Remove the key
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  pages:
    name: AltStore/SideStore sources
    needs: publish
    # Runs after every release attempt (and on its own when dispatched); cheap even when nothing was
    # released, since it only rebuilds the sources from the existing releases.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Build the sources from the GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/altstore-source.mjs site
          cp .github/pages/index.html .github/pages/privacy.html site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
