# Verification for every PR, and the gate in front of every release.
#
# Pushes to master and dev run this through release.yml (workflow_call), so a release is
# only cut from a commit that passed. On a pull request a job is skipped when its folder didn't
# change, so a PR that only touches web/ doesn't build the native app. Release.yml passes
# all-jobs, which runs every job regardless: a skipped job proves nothing, and the path filter
# diffs a push against the default branch (dev) or the previous push (master), so it can skip
# a component that changed since the last release.
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      all-jobs:
        description: Run every job, ignoring the path filter (release gating).
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            native:
              - 'native/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: inputs.all-jobs || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # The app's schedule/transit logic reasons in Budapest wall-clock time;
      # pin the test timezone so results are identical on UTC runners.
      TZ: Europe/Budapest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build
        env:
          # Build-time placeholder: the CI build only verifies the bundle
          # compiles; real values are injected via Docker build args.
          VITE_POCKETBASE_URL: http://placeholder.pocketbase.local
        run: npm run build

  backend:
    needs: changes
    if: inputs.all-jobs || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - run: go vet ./...
      - run: go test ./...

  native:
    needs: changes
    if: inputs.all-jobs || needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The baseline profile generator runs on a device only; compiling it keeps it buildable.
          - os: ubuntu-latest
            tasks: :shared:testAndroidHostTest detekt :androidApp:assembleDebug :androidApp:lint :baselineprofile:compileNonMinifiedReleaseKotlin
          # Compiles and links the shared tests for iOS (running them needs a simulator); the
          # steps below also build the Swift app and widgets. release.yml builds the IPA.
          - os: macos-latest
            tasks: :shared:compileKotlinIosSimulatorArm64 :shared:linkDebugTestIosSimulatorArm64
    runs-on: ${{ matrix.os }}
    env:
      # Same reason as above: the shared tests reason in Budapest wall-clock time.
      TZ: Europe/Budapest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      # Kotlin/Native's compiler bundle and LLVM/sysroot live in ~/.konan, which setup-gradle doesn't
      # cache; without this every macOS run downloads them again. Keyed on the Kotlin version.
      - id: kotlin
        if: runner.os == 'macOS'
        name: Read the Kotlin version
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"/\1/p' native/gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: runner.os == 'macOS'
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      # release.yml builds the committed iosApp.xcodeproj, so it must be what project.yml generates.
      # XcodeGen is pinned (version and checksum): another version may write the project differently.
      - name: Check the Xcode project matches project.yml
        if: runner.os == 'macOS'
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          (cd native/iosApp && "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --quiet)
          if [ -n "$(git status --porcelain -- native/iosApp)" ]; then
            git status --short -- native/iosApp
            git diff -- native/iosApp
            echo "::error::native/iosApp differs from what project.yml generates; run xcodegen in native/iosApp and commit the result."
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Verify
        working-directory: native
        run: ./gradlew ${{ matrix.tasks }}

      # The Swift app and widgets, unsigned for the simulator. Its Gradle phase builds the shared
      # framework (Debug), so a Swift or Kotlin/Swift interface error shows up before promotion.
      - name: Build the iOS app for the simulator
        if: runner.os == 'macOS'
        run: |
          xcodebuild build \
            -project native/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO
