server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The stock nginx image ships with gzip off, so the 1 MB catalog and the
    # MapLibre bundles were transferred uncompressed on every cold load.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        application/x-protobuf
        image/svg+xml;

    # Baseline security headers. CSP is deliberately not set here yet:
    # MapLibre needs blob: workers and inline styles that require a reviewed
    # allowlist first. nginx's add_header is not inherited into locations that
    # set their own headers, so the static/sw blocks below repeat these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Behind a TLS-terminating proxy, absolute redirects (e.g. $uri/) would
    # point at http://.
    absolute_redirect off;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell must always revalidate: a heuristically cached index.html
    # points at hashed chunks a new deploy has deleted (blank page).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # App-to-domain proofs for the native apps' passkeys: Android reads
    # assetlinks.json, iOS reads apple-app-site-association (no extension).
    # Both must be real JSON, never the SPA shell, and a missing one must 404.
    # Keep this block when the web app is retired: passkeys depend on it.
    location ^~ /.well-known/ {
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # No API is served here; answer unknown /api/* with a real 404 instead of
    # the SPA shell as 200 text/html.
    location /api/ {
        return 404;
    }

    # BKK catalog JSON is refreshed daily and fetched at runtime. Force
    # revalidation so no layer serves a stale copy; the service worker keeps an
    # offline fallback. Repeat the baseline headers — a location with its own
    # add_header does not inherit the server-level ones.
    location /catalog/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Vite's content-hashed build output never changes under the same name.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Other static files (icons, fonts, images) keep their names across
    # deploys, so they must not be immutable.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The web app manifest keeps its name across deploys; revalidate so icon
    # and name changes reach installed PWAs instead of a heuristic cache.
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Self-hosted MapLibre glyph ranges (public/fonts/*/0-255.pbf). Stable
    # names, rarely change: cache for a day like the other static files, and
    # serve them as protobuf (nginx's mime.types does not know .pbf).
    location ~* \.pbf$ {
        types { application/x-protobuf pbf; }
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Service worker must not be cached
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
