# On top of detekt's defaults. Existing findings live in baseline.xml; only new code has to pass.
style:
  ForbiddenImport:
    active: true
    forbiddenImports:
      - value: 'androidx.compose.foundation.clickable'
        reason: 'Use Modifier.tappable, or Modifier.consumeTouches for a scrim. See docs/CONTRIBUTING.md.'
      - value: 'androidx.compose.foundation.combinedClickable'
        reason: 'Use Modifier.tappable(onLongClick = ...). See docs/CONTRIBUTING.md.'
      - value: 'androidx.compose.material.*'
        reason: 'The app has its own design system; build on core/designsystem.'
      - value: 'androidx.compose.material3.*'
        reason: 'The app has its own design system; build on core/designsystem.'
    excludes: ['**/core/designsystem/theme/Modifiers.kt']
  # Tokens and constants are PascalCase here (Kotlin's Compose convention).
  MagicNumber:
    active: false
  # Guard-clause style is deliberate here, so early returns that guard are not counted.
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  # Parsers and sync loops use continue/break as guards.
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  MaxLineLength:
    active: false
  UnusedImport:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  # Tokens are PascalCase; private tuning constants may also be SCREAMING_SNAKE.
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
    propertyPattern: '[A-Za-z][A-Za-z0-9]*'
  MatchingDeclarationName:
    active: false

complexity:
  # Long declarative bodies are normal in composables; non-composable code is still checked.
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']

Compose:
  # Callback parameters read as events (onExited, onSaved, onLoaded); the rule wants present tense.
  ParameterNaming:
    active: false
  # The app's intentional CompositionLocals (design system, shell, navigation, maps).
  CompositionLocalAllowlist:
    allowedCompositionLocals:
      - LocalMapEnvironment
      - LocalSurfaceEdgeToEdge
      - LocalScreenInCard
      - LocalPageActive
      - LocalMapLifecycleOwner
      - LocalOverlayHost
      - LocalAppPresented
      - LocalToaster
      - LocalVectraColors
      - LocalVectraFonts
      - LocalAppearance
      - LocalReduceMotion
      - LocalContentColor
      - LocalTextStyle
      - LocalVectraHaptics
      - LocalWideLayout
      - LocalNavbarActions
      - LocalShellState
      - LocalTabSelected
      - LocalNavigator
      - LocalWPalette
