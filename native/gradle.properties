vectra.versionName=1.0.2
# Backend defaults for both apps (androidApp BuildConfig, shared generateIosBuildConfig). Debug builds use the
# dev backend, release builds production; -Pvectra.pocketbaseUrl=... overrides both. The transit catalog
# (/catalog/*.json) is served by the same backend, so its origin follows these URLs;
# -Pvectra.catalogOrigin=... overrides it on its own.
vectra.pocketbaseUrl.release=https://apivectra.southstar21.dev
vectra.pocketbaseUrl.debug=https://apivectra-dev.southstar21.dev
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP's Compose Preview tasks need a unit-test variant for every build type, or `gradlew tasks --all` fails.
android.onlyEnableUnitTestForTheTestedBuildType=false
