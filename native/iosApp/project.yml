# The Xcode project is generated from this file: `cd native/iosApp && xcodegen`.
# Edit this, not iosApp.xcodeproj.
name: iosApp
options:
  bundleIdPrefix: dev.southstar21
  deploymentTarget:
    iOS: "18.5"  # Compose Multiplatform's bundled ICU is built for 18.5
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The Gradle phase reads the repo and writes the framework outside the sandbox's declared outputs.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      - path: Shared
    dependencies:
      - target: VectraWidgets
        embed: true
        codeSign: true
    # xcodegen writes Info.plist and the entitlements from these; edit here, not the generated files.
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: $(VECTRA_DISPLAY_NAME)
        # Read by Shared/AppGroup.swift; differs between Debug and Release (see settings).
        VectraAppGroup: $(VECTRA_APP_GROUP)
        # Macros from the "Version from Gradle" phase (Info.plist is preprocessed).
        CFBundleShortVersionString: VECTRA_VERSION_NAME
        CFBundleVersion: VECTRA_VERSION_CODE
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: Vectra uses your location to find nearby stops and departures and to show local weather.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Background refresh keeps the week of class reminders and their departure times current.
        UIBackgroundModes: [fetch]
        # vectra://open/<path> opens a screen; the widgets use it to land on Schedule.
        CFBundleURLTypes:
          - CFBundleURLName: dev.southstar21.vectra
            CFBundleURLSchemes: [vectra]
        BGTaskSchedulerPermittedIdentifiers: [dev.southstar21.vectra.reminders]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        # Passkeys: the domain must serve apple-app-site-association listing
        # <TeamID>.dev.southstar21.vectra under webcredentials (docs/BACKEND_CHANGES.md).
        com.apple.developer.associated-domains: ["webcredentials:vectra.southstar21.dev"]
        # Shared with VectraWidgets: the app writes the widget snapshot here. A sideloading store
        # renames it to group.dev.southstar21.vectra.<TeamID>; Shared/AppGroup.swift finds either.
        # Xcode expands the setting at signing: Debug gets its own group, so a debug and a release
        # install never share widget data.
        com.apple.security.application-groups: ["$(VECTRA_APP_GROUP)"]
    settings:
      base:
        PRODUCT_NAME: Vectra
        PRODUCT_BUNDLE_IDENTIFIER: dev.southstar21.vectra
        VECTRA_APP_GROUP: group.dev.southstar21.vectra
        VECTRA_DISPLAY_NAME: Vectra
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The version comes from gradle.properties' vectra.versionName, like androidApp's.
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREFIX_HEADER: "$(DERIVED_FILE_DIR)/VectraVersion.h"
        # Apple Developer team that signs device and App Store builds (also listed in the site's apple-app-site-association for passkeys).
        DEVELOPMENT_TEAM: 3HNYQ2F575
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        # shared targets iosArm64 + iosSimulatorArm64 only (MapLibre ships no x64 simulator build).
        "ARCHS[sdk=iphonesimulator*]": arm64
        # The shared Kotlin framework (static), built by the Gradle phase below.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared", "-lsqlite3", "-lc++"]
      # Debug builds talk to the dev backend (shared/build.gradle.kts) and install next to the
      # release app. Passkeys need <TeamID>.dev.southstar21.vectra.debug in apple-app-site-association.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.southstar21.vectra.debug
          VECTRA_APP_GROUP: group.dev.southstar21.vectra.debug
          VECTRA_DISPLAY_NAME: Vectra Dev
    preBuildScripts:
      - name: Version from Gradle
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        outputFiles: ["$(DERIVED_FILE_DIR)/VectraVersion.h"]
        script: |
          # Same rule as androidApp's versionCode: 1.2.3 -> 1020399, 1.2.3-dev.4 -> 1020304,
          # 1.2.3-rc.2 -> 1020352. The short version drops the prerelease suffix (iOS wants x.y.z).
          # Debug builds use the newest vX.Y.Z tag instead, like the Gradle builds (native/build.gradle.kts):
          # gradle.properties only holds the real version while CI builds a release.
          set -e
          FULL=$(sed -n 's/^vectra.versionName=//p' "$SRCROOT/../gradle.properties")
          if [ "$CONFIGURATION" = "Debug" ]; then
            TAG=$(git -C "$SRCROOT" tag --list 'v*' | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            [ -n "$TAG" ] && FULL=$TAG
          fi
          NAME=${FULL%%-*}
          # Past dev.49 or rc.48 two builds would share a build number: fail instead, as Gradle does.
          CODE=$(echo "$FULL" | awk -F'[.-]' '{
            b = 99
            if (($4 == "dev" && $5 > 49) || ($4 == "rc" && $5 > 48)) { print "prerelease number too high for the build number scheme: " $0 > "/dev/stderr"; exit 1 }
            if ($4 == "dev") b = $5
            if ($4 == "rc") b = 50 + $5
            print ($1 * 10000 + $2 * 100 + $3) * 100 + b
          }')
          mkdir -p "$DERIVED_FILE_DIR"
          printf '#define VECTRA_VERSION_NAME %s\n#define VECTRA_VERSION_CODE %s\n' "$NAME" "$CODE" > "$DERIVED_FILE_DIR/VectraVersion.h"
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  # Home-screen and Lock Screen widgets. Pure SwiftUI: it reads the JSON snapshot the app writes to
  # the App Group (shared/…/features/widgets) and never links the Kotlin framework.
  VectraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VectraWidgets
      - path: Shared
      # The app's own Inter and JetBrains Mono files, bundled as they are (no copies in the repo).
      - path: ../shared/src/commonMain/composeResources/font
        buildPhase: resources
    info:
      path: VectraWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(VECTRA_DISPLAY_NAME)
        VectraAppGroup: $(VECTRA_APP_GROUP)
        # The app's version (same macros): an extension must never trail its app.
        CFBundleShortVersionString: VECTRA_VERSION_NAME
        CFBundleVersion: VECTRA_VERSION_CODE
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VectraWidgets/VectraWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["$(VECTRA_APP_GROUP)"]
    settings:
      base:
        PRODUCT_NAME: VectraWidgets
        PRODUCT_BUNDLE_IDENTIFIER: dev.southstar21.vectra.widgets
        VECTRA_APP_GROUP: group.dev.southstar21.vectra
        VECTRA_DISPLAY_NAME: Vectra
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREFIX_HEADER: "$(DERIVED_FILE_DIR)/VectraVersion.h"
        DEVELOPMENT_TEAM: 3HNYQ2F575
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "ARCHS[sdk=iphonesimulator*]": arm64
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.southstar21.vectra.debug.widgets
          VECTRA_APP_GROUP: group.dev.southstar21.vectra.debug
          VECTRA_DISPLAY_NAME: Vectra Dev
    preBuildScripts:
      - name: Version from Gradle
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        outputFiles: ["$(DERIVED_FILE_DIR)/VectraVersion.h"]
        script: |
          # Same rule as androidApp's versionCode: 1.2.3 -> 1020399, 1.2.3-dev.4 -> 1020304,
          # 1.2.3-rc.2 -> 1020352. The short version drops the prerelease suffix (iOS wants x.y.z).
          # Debug builds use the newest vX.Y.Z tag instead, like the Gradle builds (native/build.gradle.kts):
          # gradle.properties only holds the real version while CI builds a release.
          set -e
          FULL=$(sed -n 's/^vectra.versionName=//p' "$SRCROOT/../gradle.properties")
          if [ "$CONFIGURATION" = "Debug" ]; then
            TAG=$(git -C "$SRCROOT" tag --list 'v*' | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            [ -n "$TAG" ] && FULL=$TAG
          fi
          NAME=${FULL%%-*}
          # Past dev.49 or rc.48 two builds would share a build number: fail instead, as Gradle does.
          CODE=$(echo "$FULL" | awk -F'[.-]' '{
            b = 99
            if (($4 == "dev" && $5 > 49) || ($4 == "rc" && $5 > 48)) { print "prerelease number too high for the build number scheme: " $0 > "/dev/stderr"; exit 1 }
            if ($4 == "dev") b = $5
            if ($4 == "rc") b = 50 + $5
            print ($1 * 10000 + $2 * 100 + $3) * 100 + b
          }')
          mkdir -p "$DERIVED_FILE_DIR"
          printf '#define VECTRA_VERSION_NAME %s\n#define VECTRA_VERSION_CODE %s\n' "$NAME" "$CODE" > "$DERIVED_FILE_DIR/VectraVersion.h"
